name: Terraform setup
description: Installs the pinned Terraform version and optionally authenticates to GCP through the GitHub OIDC pool.

inputs:
  authenticate:
    description: Whether to authenticate to GCP (false for credential-free jobs).
    required: true
  workload_identity_provider:
    description: Full resource name of the Workload Identity Federation provider.
    required: false
    default: ''
  service_account:
    description: Service account to impersonate.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # A job that needs credentials must fail here if a variable is missing,
    # not later with a confusing backend error.
    - name: ✔️ Check GCP inputs
      if: inputs.authenticate == 'true' && (inputs.service_account == '' || inputs.workload_identity_provider == '')
      shell: bash
      run: |
        echo "::error::authenticate is true but workload_identity_provider or service_account is empty"
        exit 1
    - name: 🔑 Authenticate to Google Cloud
      if: inputs.authenticate == 'true'
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
    # Exact version, shared by every job: a saved plan can only be applied by
    # the Terraform version that created it.
    - name: 🧱 Install Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: 1.14.4
        terraform_wrapper: false
