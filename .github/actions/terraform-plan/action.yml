name: Terraform plan
description: Writes a saved plan (tfplan) and its text rendering (plan.txt).

inputs:
  working-directory:
    description: Terraform stack directory.
    required: true

outputs:
  has_changes:
    description: Whether the plan contains changes.
    value: ${{ steps.plan.outputs.has_changes }}

runs:
  using: composite
  steps:
    - name: ⚙️ Init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: terraform init -input=false -lockfile=readonly
    - name: 📋 Plan
      id: plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set +e
        # The read-only planner can't take the state lock.
        terraform plan -input=false -lock=false -no-color -detailed-exitcode -out=tfplan
        code=$?
        set -e
        case $code in
          0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
          2) echo "has_changes=true" >> "$GITHUB_OUTPUT" ;;
          *) exit "$code" ;;
        esac
        terraform show -no-color tfplan > plan.txt
