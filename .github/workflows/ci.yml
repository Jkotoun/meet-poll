name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  # PR pushes share a group so a new push supersedes the old run; pushes to
  # develop/main are grouped per commit so every landed commit keeps its own
  # pass/fail result (a shared group would still drop queued runs).
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history so `turbo --affected` can diff against the base branch;
      # a shallow clone makes it treat every package as changed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run format:check

      - uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Lint, typecheck, test and build affected packages
        run: |
          # The PR base is passed as a remote ref: the bare branch name isn't a
          # local ref in this checkout, and when it is also a repo path (e.g. a
          # stacked PR onto `infra/main`) git reads it as that path.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            export TURBO_SCM_BASE="origin/$GITHUB_BASE_REF"
          fi
          bunx turbo run lint typecheck test test:e2e build --affected --summarize

      # Each run restores the previous cache and saves it under a new key, so
      # without pruning, artifacts of every past commit would be carried forward
      # forever. Keep only what this run produced or hit; a run with no
      # affected tasks has nothing new and skips saving entirely.
      - name: Prune Turbo cache to this run's tasks
        id: prune
        run: |
          hashes=$(jq -r '.tasks[].hash' .turbo/runs/*.json)
          if [ -z "$hashes" ]; then
            echo "save=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          find .turbo/cache -type f | grep -vF "$hashes" | xargs -r rm
          echo "save=true" >> "$GITHUB_OUTPUT"

      - if: steps.prune.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}

  # Job-level path gating rather than workflow-level `paths:` — a skipped
  # workflow leaves required status checks pending forever, a skipped job
  # counts as passed.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # On push, diff against the previous commit of the same branch
          # (default would be the merge-base with the repo default branch).
          # Left empty on pull_request, where the PR base is used and a set
          # base only produces a warning.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            backend:
              - apps/backend/**
              # The image's prune stage validates the shared lockfile against
              # every workspace manifest.
              - apps/frontend/package.json
              - packages/**
              - package.json
              - bun.lock
              - turbo.json
              - .dockerignore
              - .github/workflows/ci.yml

  backend-image:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Read Bun version
        id: bun
        run: |
          pm=$(jq -r '.packageManager // empty' package.json)
          if [[ ! "$pm" =~ ^bun@([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::packageManager must be bun@X.Y.Z, got '$pm'"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          build-args: BUN_VERSION=${{ steps.bun.outputs.version }}
          tags: meet-poll-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Smoke test container
        run: |
          docker run -d --name backend -p 8080:8080 meet-poll-backend:ci
          for _ in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' backend)" != true ]; then
              echo "::error::Container exited during startup"
              docker logs backend
              exit 1
            fi
            curl -fs --max-time 2 localhost:8080/health && break
            sleep 1
          done
          curl -fs --max-time 2 localhost:8080/health || { docker logs backend; exit 1; }

          # Cloud Run sends SIGTERM on scale-down; the app must exit cleanly
          # well within the grace period rather than being SIGKILLed — even
          # with an idle keep-alive connection open, as Cloud Run's front end
          # holds them.
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3
          docker stop -t 5 backend
          exec 3>&-
          code=$(docker inspect -f '{{.State.ExitCode}}' backend)
          if [ "$code" != 0 ]; then
            echo "::error::Container exited with $code on SIGTERM (expected 0)"
            docker logs backend
            exit 1
          fi
