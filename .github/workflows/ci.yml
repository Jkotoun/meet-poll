name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🎨 Check formatting
        run: bun run format:check
      - name: 💾 Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - name: ✅ Build, lint, typecheck and test
        run: bunx turbo run build lint typecheck test test:e2e

  # Job-level filter: a skipped job passes required checks, a skipped workflow doesn't.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🔎 Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # On push, diff against the branch's previous commit.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            shared: &shared
              - packages/**
              - package.json
              - bun.lock
              - turbo.json
              - .dockerignore
              - .github/workflows/ci.yml
            # turbo prune validates the lockfile against every workspace.
            backend:
              - *shared
              - apps/backend/**
              - apps/frontend/package.json
            frontend:
              - *shared
              - apps/frontend/**
              - apps/backend/package.json
            infra:
              - infra/**
              - .github/workflows/ci.yml

  backend-image:
    name: Backend image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🏗️ Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontend-image:
    name: Frontend image
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🏗️ Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/frontend/Dockerfile
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  terraform-check:
    name: Terraform check (${{ matrix.stack }})
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        stack: [bootstrap]
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🧱 Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~1.14
      - name: 🎨 Check formatting
        run: terraform fmt -check -recursive
      # No backend: validation needs provider schemas, not state or credentials.
      - name: ⚙️ Init
        run: terraform init -backend=false -input=false
      - name: ✅ Validate
        run: terraform validate
