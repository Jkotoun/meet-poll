name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🎨 Check formatting
        run: bun run format:check
      - name: 💾 Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - name: ✅ Build, lint, typecheck and test
        run: bunx turbo run build lint typecheck test test:e2e

  # Job-level filter: a skipped job passes required checks, a skipped workflow doesn't.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🔎 Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # On push, diff against the branch's previous commit.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            shared: &shared
              - packages/**
              - package.json
              - bun.lock
              - turbo.json
              - .dockerignore
              - .github/workflows/ci.yml
            # turbo prune validates the lockfile against every workspace.
            backend:
              - *shared
              - apps/backend/**
              - apps/frontend/package.json
            frontend:
              - *shared
              - apps/frontend/**
              - apps/backend/package.json
            infra:
              - infra/**
              - .github/workflows/ci.yml
              - .github/scripts/upsert-plan-comment.js
              - .github/scripts/plan-markdown.js
              - .github/actions/**
            workflows:
              - .github/workflows/**
              - .github/actions/**

  backend-image:
    name: Backend image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🏗️ Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontend-image:
    name: Frontend image
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🏗️ Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/frontend/Dockerfile
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  terraform-check:
    name: Terraform check (${{ matrix.stack }})
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        stack: [bootstrap, main]
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/terraform-setup
        with:
          authenticate: false
      - run: terraform fmt -check -recursive
      - name: ⚙️ Init
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: ✅ Validate
        run: terraform validate

  terraform-plan:
    name: Terraform plan
    needs: changes
    if: >-
      github.event_name == 'pull_request'
      && needs.changes.outputs.infra == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: infra/main
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/terraform-setup
        with:
          authenticate: true
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLANNER_SA }}
      - uses: ./.github/actions/terraform-plan
        with:
          working-directory: infra/main
      - name: 💬 Comment plan on PR
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        with:
          script: |
            const upsert = require('./.github/scripts/upsert-plan-comment.js');
            await upsert({ github, context, planFile: 'infra/main/plan.txt' });

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Also shellchecks every `run:` block.
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
