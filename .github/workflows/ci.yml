name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  # PR pushes share a group so a new push supersedes the old run; pushes to
  # develop/main are grouped per commit so every landed commit keeps its own
  # pass/fail result (a shared group would still drop queued runs).
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history so `turbo --affected` can diff against the base branch;
      # a shallow clone makes it treat every package as changed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run format:check

      - uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Lint, typecheck, test and build affected packages
        run: |
          # The PR base is passed as a remote ref: the bare branch name isn't a
          # local ref in this checkout, and when it is also a repo path (e.g. a
          # stacked PR onto `infra/main`) git reads it as that path.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            export TURBO_SCM_BASE="origin/$GITHUB_BASE_REF"
          fi
          bunx turbo run lint typecheck test test:e2e build --affected --summarize

      # Each run restores the previous cache and saves it under a new key, so
      # without pruning, artifacts of every past commit would be carried forward
      # forever. Keep only what this run produced or hit; a run with no
      # affected tasks has nothing new and skips saving entirely.
      - name: Prune Turbo cache to this run's tasks
        id: prune
        run: |
          hashes=$(jq -r '.tasks[].hash' .turbo/runs/*.json)
          if [ -z "$hashes" ]; then
            echo "save=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          find .turbo/cache -type f | grep -vF "$hashes" | xargs -r rm
          echo "save=true" >> "$GITHUB_OUTPUT"

      - if: steps.prune.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}

  # Job-level path gating rather than workflow-level `paths:` — a skipped
  # workflow leaves required status checks pending forever, a skipped job
  # counts as passed.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # On push, diff against the previous commit of the same branch
          # (default would be the merge-base with the repo default branch).
          # Left empty on pull_request, where the PR base is used and a set
          # base only produces a warning.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            shared: &shared
              - packages/**
              - package.json
              - bun.lock
              - turbo.json
              - .dockerignore
              - .github/workflows/ci.yml
              - .github/scripts/**
            # Each image's prune stage validates the shared lockfile against
            # every workspace manifest, so the other app's package.json counts.
            backend:
              - *shared
              - apps/backend/**
              - apps/frontend/package.json
            frontend:
              - *shared
              - apps/frontend/**
              - apps/backend/package.json

  backend-image:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Read Bun version
        id: bun
        # Assigned first: a failing $(...) inside echo would not fail the step.
        run: |
          version=$(.github/scripts/bun-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          build-args: BUN_VERSION=${{ steps.bun.outputs.version }}
          tags: meet-poll-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - run: .github/scripts/smoke-test-container.sh meet-poll-backend:ci 0 /health

  frontend-image:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Read Bun version
        id: bun
        # Assigned first: a failing $(...) inside echo would not fail the step.
        run: |
          version=$(.github/scripts/bun-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/frontend/Dockerfile
          build-args: BUN_VERSION=${{ steps.bun.outputs.version }}
          tags: meet-poll-frontend:ci
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      # Next's standalone server drains pending requests on SIGTERM, then
      # exits 143 by design (an unhandled SIGTERM would leave bun as PID 1
      # running until SIGKILL, giving 137).
      - run: .github/scripts/smoke-test-container.sh meet-poll-frontend:ci 143 /
