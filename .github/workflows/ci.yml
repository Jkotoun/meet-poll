name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🎨 Check formatting
        run: bun run format:check
      - name: 💾 Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-
      - name: ✅ Build, lint, typecheck and test
        run: bunx turbo run build lint typecheck test test:e2e

  # Job-level path gating rather than workflow-level `paths:` — a skipped
  # workflow leaves required status checks pending forever, a skipped job
  # counts as passed.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🔎 Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # On push, diff against the previous commit of the same branch
          # (default would be the merge-base with the repo default branch).
          # Left empty on pull_request, where the PR base is used and a set
          # base only produces a warning.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            shared: &shared
              - packages/**
              - package.json
              - bun.lock
              - turbo.json
              - .dockerignore
              - .github/workflows/ci.yml
              - .github/scripts/**
            # Each image's prune stage validates the shared lockfile against
            # every workspace manifest, so the other app's package.json counts.
            backend:
              - *shared
              - apps/backend/**
              - apps/frontend/package.json
            frontend:
              - *shared
              - apps/frontend/**
              - apps/backend/package.json

  backend-image:
    name: Backend image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🥟 Read Bun version
        id: bun
        # Assigned first: a failing $(...) inside echo would not fail the step.
        run: |
          version=$(.github/scripts/bun-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: 🏗️ Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          build-args: BUN_VERSION=${{ steps.bun.outputs.version }}
          tags: meet-poll-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: 💨 Smoke test container
        run: .github/scripts/smoke-test-container.sh meet-poll-backend:ci 0 /health

  frontend-image:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Read Bun version
        id: bun
        # Assigned first: a failing $(...) inside echo would not fail the step.
        run: |
          version=$(.github/scripts/bun-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/frontend/Dockerfile
          build-args: BUN_VERSION=${{ steps.bun.outputs.version }}
          tags: meet-poll-frontend:ci
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      # Next's standalone server drains pending requests on SIGTERM, then
      # exits 143 by design (an unhandled SIGTERM would leave bun as PID 1
      # running until SIGKILL, giving 137).
      - run: .github/scripts/smoke-test-container.sh meet-poll-frontend:ci 143 /
