name: Deploy app

on:
  workflow_call:
    inputs:
      app:
        description: App directory under apps/ (backend or frontend).
        type: string
        required: true
      health_path:
        description: Path the smoke test expects a 2xx from.
        type: string
        required: true
      secrets:
        description: Secret Manager env bindings for --update-secrets (ENV=secret:version,...).
        type: string
        default: ''
      env_vars:
        description: Plain env vars for --update-env-vars (NAME=value,...).
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build, test and promote
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: meet-poll-${{ inputs.app }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/meet-poll/${{ inputs.app }}:${{ github.sha }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - name: ☁️ Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: 🐳 Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: 🏗️ Build and push image
        uses: ./.github/actions/build-image
        with:
          app: ${{ inputs.app }}
          tags: ${{ env.IMAGE }}
          push: true

      # No --tag here: it would pin the revision name in the template, and
      # Terraform's next template change would then fail with 409.
      - name: 🚢 Deploy candidate revision (no traffic)
        id: deploy
        env:
          SECRETS: ${{ inputs.secrets }}
          ENV_VARS: ${{ inputs.env_vars }}
        run: |
          gcloud run deploy "$SERVICE" --region "$REGION" --image "$IMAGE" --no-traffic --quiet \
            ${SECRETS:+--update-secrets "$SECRETS"} \
            ${ENV_VARS:+--update-env-vars "$ENV_VARS"}
          revision=$(gcloud run services describe "$SERVICE" --region "$REGION" \
            --format='value(status.latestCreatedRevisionName)')
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: 🏷️ Tag candidate
        id: candidate
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --set-tags "candidate=${{ steps.deploy.outputs.revision }}" --quiet
          url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json |
            jq -er '.status.traffic[] | select(.tag == "candidate") | .url')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: 💨 Smoke test candidate
        run: .github/scripts/smoke-test-url.sh "${{ steps.candidate.outputs.url }}${{ inputs.health_path }}"

      - name: ✅ Promote candidate
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --to-revisions "${{ steps.deploy.outputs.revision }}=100" --quiet

      - name: 🧹 Withdraw candidate
        if: ${{ !success() && steps.deploy.outputs.revision != '' }}
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --remove-tags candidate --quiet
