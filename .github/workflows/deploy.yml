name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a half-done apply or traffic switch.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Re-running an old run must not roll prod back to that commit.
  guard:
    name: Check tip of main
    runs-on: ubuntu-latest
    outputs:
      is_tip: ${{ steps.tip.outputs.is_tip }}
    steps:
      - name: 🎯 Check commit is tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$GITHUB_SHA is no longer the tip of main; skipping"
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
          fi

  terraform-plan:
    name: Terraform plan
    needs: guard
    if: needs.guard.outputs.is_tip == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    defaults:
      run:
        working-directory: infra/main
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLANNER_SA }}
      - name: 🧱 Set up Terraform
        uses: ./.github/actions/terraform-setup
      - name: 📋 Plan
        id: plan
        uses: ./.github/actions/terraform-plan
        with:
          working-directory: infra/main
      - name: 📝 Write plan summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Terraform plan — \`infra/main\`"
            node ../../.github/scripts/plan-markdown.js plan.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 📤 Upload plan
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: infra/main/tfplan
          retention-days: 30
          overwrite: true

  terraform-apply:
    name: Terraform apply
    needs: terraform-plan
    if: needs.terraform-plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/main
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}
      - name: 🧱 Set up Terraform
        uses: ./.github/actions/terraform-setup
      - name: ⚙️ Init
        run: terraform init -input=false -lockfile=readonly
      - name: 📥 Download plan
        uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: infra/main
      - name: 🚀 Apply
        run: terraform apply -input=false tfplan

  changes:
    name: Detect changed apps
    needs: [terraform-plan, terraform-apply]
    if: >-
      !cancelled()
      && needs.terraform-plan.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.terraform-apply.result)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🔎 Detect changed paths
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          filters: |
            shared: &shared
              - packages/**
              - package.json
              - bun.lock
              - turbo.json
              - .dockerignore
              - .github/actions/build-image/**
              - .github/workflows/deploy.yml
              - .github/workflows/deploy-app.yml
            backend:
              - *shared
              - apps/backend/**
              - apps/frontend/package.json
            frontend:
              - *shared
              - apps/frontend/**
              - apps/backend/package.json
              - apps/backend/openapi.json

  deploy-backend:
    name: Deploy backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: backend
      health_path: /health
      secrets: DATABASE_URL=database-url:latest,JWT_SECRET=jwt-secret:latest

  deploy-frontend:
    name: Deploy frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: frontend
      health_path: /
      env_vars: BACKEND_URL=${{ vars.BACKEND_URL }}
