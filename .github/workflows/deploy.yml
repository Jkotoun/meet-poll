name: Deploy

on:
  push:
    branches: [main]

# Deploys queue rather than cancel: aborting a half-done apply or traffic
# switch leaves prod in an in-between state.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Only the tip of main deploys. Re-running an older run must not roll back
  # infra or apps; the newer commit's own run deploys it.
  guard:
    name: Check tip of main
    runs-on: ubuntu-latest
    outputs:
      is_tip: ${{ steps.tip.outputs.is_tip }}
    steps:
      - name: 🎯 Check commit is tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$GITHUB_SHA is no longer the tip of main; skipping"
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
          fi

  # Plans on every push instead of path-filtering: the concurrency queue drops
  # superseded pending runs, so a diff against the previous commit could miss
  # an infra change whose own run never started. Plan compares against real
  # state, and the apply only runs when there is something to apply.
  terraform-plan:
    name: Terraform plan
    needs: guard
    # vars.GCP_WIF_PROVIDER is empty until infra/bootstrap is applied by hand;
    # that condition is temporary (ROADMAP 1.8).
    if: needs.guard.outputs.is_tip == 'true' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    defaults:
      run:
        working-directory: infra/main
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🧱 Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          authenticate: true
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLANNER_SA }}
      - name: 📋 Plan
        id: plan
        uses: ./.github/actions/terraform-plan
        with:
          working-directory: infra/main
      # Also on failure, so the run page says why instead of only going red.
      - name: 📝 Write plan summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Terraform plan — \`infra/main\`"
            if [ -f plan.txt ]; then
              node ../../.github/scripts/plan-markdown.js plan.txt
            else
              echo "Plan failed — see the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # The repository is public, so this plan file and the summary above are
      # readable by anyone: secret values must never be in Terraform state.
      - name: 📤 Upload plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: infra/main/tfplan
          # Matches how long a `prod` approval can stay pending (30 days); a
          # plan older than the state is refused at apply anyway. Overwrite
          # lets "re-run all jobs" re-plan.
          retention-days: 30
          overwrite: true

  # The approval prompt for the `prod` Environment shows this run's summary,
  # i.e. exactly the plan that will be applied.
  terraform-apply:
    name: Terraform apply
    needs: terraform-plan
    if: needs.terraform-plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    # Generous: a timeout mid-apply leaves partially applied infra and
    # possibly a held state lock.
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/main
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🧱 Set up Terraform
        uses: ./.github/actions/terraform-setup
        with:
          authenticate: true
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}
      - name: ⚙️ Init
        run: terraform init -input=false -lockfile=readonly
      - name: 📥 Download plan
        uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: infra/main
      - name: 🚀 Apply
        run: terraform apply -input=false tfplan

  changed-apps:
    name: Detect changed apps
    needs: [terraform-plan, terraform-apply]
    # After infra is applied (or there was nothing to apply), so new infra
    # exists before code that relies on it; never after a failed plan/apply.
    if: >-
      !cancelled()
      && needs.terraform-plan.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.terraform-apply.result)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      apps: ${{ steps.check.outputs.apps }}
    steps:
      # Full history: changes are diffed against the commit each service serves.
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - name: ☁️ Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: 🔎 Find apps to deploy
        id: check
        run: |
          apps=$(.github/scripts/changed-apps.sh "${{ vars.GCP_REGION }}" backend frontend)
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.app }}
    needs: changed-apps
    if: needs.changed-apps.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changed-apps.outputs.apps) }}
    env:
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: meet-poll-${{ matrix.app }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/meet-poll/${{ matrix.app }}:${{ github.sha }}
      HEALTH_PATH: ${{ matrix.app == 'backend' && '/health' || '/' }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - name: ☁️ Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: 🐳 Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: 🏗️ Build and push image
        uses: ./.github/actions/build-image
        with:
          app: ${{ matrix.app }}
          tags: ${{ env.IMAGE }}
          push: true

      # No --tag/--revision-suffix on deploy: with either, gcloud names the
      # revision client-side into the service template, which Terraform would
      # then resend on its next template change (409, name already exists).
      # Tagging separately keeps revision naming server-side.
      - name: 🚢 Deploy candidate revision (no traffic)
        id: deploy
        run: |
          gcloud run deploy "$SERVICE" --region "$REGION" --image "$IMAGE" --no-traffic --quiet
          revision=$(gcloud run services describe "$SERVICE" --region "$REGION" \
            --format='value(status.latestCreatedRevisionName)')
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      # A stable public URL for the candidate, used only by the smoke test.
      - name: 🏷️ Tag candidate
        id: candidate
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --set-tags "candidate=${{ steps.deploy.outputs.revision }}" --quiet
          url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json |
            jq -er '.status.traffic[] | select(.tag == "candidate") | .url')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: 💨 Smoke test candidate
        run: .github/scripts/smoke-test-url.sh "${{ steps.candidate.outputs.url }}" "$HEALTH_PATH"

      # Exactly the tested revision, not "latest": a revision created in the
      # meantime (e.g. by a Terraform apply) must never serve untested.
      - name: ✅ Promote candidate
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --to-revisions "${{ steps.deploy.outputs.revision }}=100" --quiet

      # The tagged URL is public; don't leave an untested or failed build
      # reachable there — including on timeout or cancellation.
      - name: 🧹 Withdraw candidate
        if: ${{ !success() && steps.deploy.outputs.revision != '' }}
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --remove-tags candidate --quiet || true
