services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: meetpoll
      POSTGRES_PASSWORD: meetpoll
      POSTGRES_DB: meetpoll
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meetpoll -d meetpoll']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
